# Publica as Edge Functions no Supabase quando algo em supabase/functions/
# muda na main. Precisa do secret SUPABASE_ACCESS_TOKEN no GitHub
# (token pessoal do Supabase; ver docs/SUPABASE.md).
name: deploy-functions
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:          # permite rodar manualmente
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: mayocglxeoyxrmetmdbl   # não é segredo (aparece na URL do projeto)
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publicar gerenciar-aluno
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}   # só nesta etapa
        run: supabase functions deploy gerenciar-aluno --project-ref "$SUPABASE_PROJECT_REF" --use-api
