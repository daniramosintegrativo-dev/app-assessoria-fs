# Publica no Supabase o que mudou na main:
# 1) migrações do banco (supabase/migrations), na ordem, só as que faltam;
# 2) depois, as Edge Functions.
# Secrets no GitHub (ver docs/SUPABASE.md):
# - SUPABASE_DB_URL: endereço "Session pooler" do banco, com a senha.
# - SUPABASE_ACCESS_TOKEN: token com escopo só de Edge Functions do projeto.
name: deploy-functions
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:          # permite rodar manualmente
permissions:
  contents: read
jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Aplicar migrações pendentes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}   # só nesta etapa
        run: |
          # Tira espaços/quebras de linha (comuns ao copiar no celular) e
          # codifica a senha, que pode ter símbolos como @ # / ? que quebram o endereço.
          URL=$(printf '%s' "$SUPABASE_DB_URL" | tr -d '[:space:]')
          if [ -z "$URL" ]; then echo "Falta o secret SUPABASE_DB_URL (ver docs/SUPABASE.md)."; exit 1; fi
          case "$URL" in *YOUR-PASSWORD*) echo "O secret ainda tem o texto [YOUR-PASSWORD]: troque pela senha."; exit 1;; esac
          SUPABASE_DB_URL=$(printf '%s' "$URL" | python3 -c 'import sys, urllib.parse as u
          s = sys.stdin.read()
          esquema, resto = s.split("://", 1)
          credenciais, servidor = resto.rsplit("@", 1)
          usuario, senha = credenciais.split(":", 1)
          print(f"{esquema}://{usuario}:{u.quote(u.unquote(senha), safe=str())}@{servidor}")') || { echo "O secret não tem o formato postgresql://usuario:senha@servidor/postgres"; exit 1; }
          # Estas foram aplicadas à mão pelo SQL Editor antes da automação:
          # marca como aplicadas (pode repetir sem efeito).
          supabase migration repair --db-url "$SUPABASE_DB_URL" --status applied 20261012000000 20261013000000 20261020000000 20261021000000 20261021000100 20261021000200 20261022000000
          supabase db push --db-url "$SUPABASE_DB_URL" --yes

  deploy:
    needs: migrar             # a função nova só sobe com o banco já atualizado
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: mayocglxeoyxrmetmdbl   # não é segredo (aparece na URL do projeto)
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publicar gerenciar-aluno
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}   # só nesta etapa
        run: supabase functions deploy gerenciar-aluno --project-ref "$SUPABASE_PROJECT_REF" --use-api
