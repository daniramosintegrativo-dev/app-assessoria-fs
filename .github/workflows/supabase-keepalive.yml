# Evita que o Supabase gratuito pause por inatividade (D8).
# Usa só o endereço e a chave publishable, que são públicos (estão no app).
# Requer a tabela pública "keepalive" (migração 20261020000000_keepalive.sql).
name: supabase-keepalive
on:
  schedule:
    - cron: "0 12 */3 * *"   # a cada 3 dias, 12h UTC
  workflow_dispatch:          # permite rodar manualmente
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve no banco
        run: >
          curl -sf "https://mayocglxeoyxrmetmdbl.supabase.co/rest/v1/keepalive?select=id&limit=1"
          -H "apikey: sb_publishable_RZX_85w0qXXyAM0qX6dHyA_RxpycX9U"
