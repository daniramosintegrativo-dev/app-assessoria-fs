# Evita que o Supabase gratuito pause por inatividade (D8).
# Precisa dos secrets SUPABASE_URL e SUPABASE_ANON_KEY no GitHub.
# Requer a tabela pública "keepalive" com RLS permitindo só SELECT.
name: supabase-keepalive
on:
  schedule:
    - cron: "0 12 */3 * *"   # a cada 3 dias, 12h UTC
  workflow_dispatch:          # permite rodar manualmente
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve no banco
        run: >
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive?select=id&limit=1"
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
